<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quiz ໃບຂັບຂີ່">
    <meta name="theme-color" content="#0f172a">

    <title>ໂປຼແກມຮຽນ ຄຳຖາມສອບເສັງໃບຂັບຂີ່ - Lao Driving License Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <style>
        @font-face {
            font-family: 'Phetsarath';
            src: url('Phetsarath-OT.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        body, button, input, select, textarea {
            font-family: 'Phetsarath', sans-serif !important;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const quizBox = document.getElementById('main-quiz-box');
            const syncBackground = () => {
                if (quizBox) {
                    const currentBg = window.getComputedStyle(quizBox).backgroundColor;
                    document.body.style.backgroundColor = currentBg;
                    document.documentElement.style.backgroundColor = currentBg;
                }
            };
            setInterval(syncBackground, 50);
        });
    </script>
</head>
<body id="app-body">

    <div class="quiz-container" id="main-quiz-box">
        
        <!-- 🏠 หน้าที่ 1: หน้าแรก (Home Screen) -->
        <div id="home-screen" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; overflow-y: auto;">
            
            <div style="width: 100%; max-width: 360px;">
<div style="font-size: 1.0rem; font-weight: bold; color: #ffffff; margin-bottom: 8px; background: rgba(0, 0, 0, 0.3); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
    <span style="display: flex; align-items: center; gap: 8px;">
        <img src="icon-192.png" alt="Logo" style="width: 26px; height: 26px; object-fit: contain; border-radius: 50%; background: #ffffff;">
        ໂຮງຮຽນສອນຂັບລົດບ້ານສາມັກຄີ
    </span>
    <img onclick="teacherUnlock()" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'></rect><path d='7 11V7a5 5 0 0 1 10 0v4'></path></svg>" title="ສໍາລັບຄູສອນ" style="cursor: pointer; opacity: 0.9; width: 22px; height: 22px;">
</div>
                <h1 style="font-size: 1.15rem; color: #ffffff; margin-bottom: 8px; font-weight: bold;">020-22293666,02077116687</h1>
                
                <div id="student-profile-box" style="margin-bottom: 10px; text-align: left; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px;">
                    <div style="font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #fbbf24; text-align: center;">📋 ຂໍ້ມູນສ່ວນຕົວຜູ້ສອບເສັງ:</div>
                    
                    <div style="margin-bottom: 6px;">
                        <input type="text" id="studentName" placeholder="ຊື່ ແລະ ນາມສະກຸນ..." style="width: 100%; box-sizing: border-box; padding: 7px; font-size: 0.85rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background-color: #475569 !important; color: #ffffff !important; outline: none; font-weight: bold;">
                    </div>

                    <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                        <input type="number" id="studentAge" placeholder="ອາຍຸ..." style="width: 50%; box-sizing: border-box; padding: 7px; font-size: 0.85rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background-color: #475569 !important; color: #ffffff !important; outline: none; font-weight: bold;">
                        <input type="tel" id="studentPhone" placeholder="ເບີໂທລະສັບ..." style="width: 50%; box-sizing: border-box; padding: 7px; font-size: 0.85rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background-color: #475569 !important; color: #ffffff !important; outline: none; font-weight: bold;">
                    </div>

                    <div>
                        <select id="homeCategory" onchange="checkHomeUnlockStatus()" style="width: 100%; box-sizing: border-box; padding: 7px; font-size: 0.85rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background-color: #475569 !important; color: #ffffff !important; font-weight: bold; outline: none; cursor: pointer;">
                            <option value="" disabled selected style="background-color: #475569; color: #94a3b8;">-- ເລືອກປະເພດໃບຂັບຂີ່ --</option>
                            <option value="ABC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ ABC</option>
                            <option value="A.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ A</option>
                            <option value="AB.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ AB</option>
                            <option value="B.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ B</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ C</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ D</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ BC</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px;">
                    <button id="btn-mode-1" onclick="validateAndStartApp('study')" style="padding: 10px 14px; font-size: 0.95rem; font-weight: bold; background: #0033FF; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        📖 1. ໂໝດອ່ານຮຽນຮູ້ (ຄຳຕອບຖືກສະແດງ)
                    </button>
                    
                    <button id="btn-mode-2" onclick="validateAndStartApp('quiz')" style="padding: 10px 14px; font-size: 0.95rem; font-weight: bold; background: #64748b; color: #cbd5e1; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        🔒 2. ໂໝດແບບທົດສອບ (ຄິດຄະແນນ) - [ຕ້ອງອ່ານໝວດ 1 ໃຫ້ຈົບກ່ອນ]
                    </button>

                    <button id="btn-mode-3" onclick="validateAndStartApp('random')" style="padding: 10px 14px; font-size: 0.95rem; font-weight: bold; background: #64748b; color: #cbd5e1; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        🔒 3. ໂໝດສະຫຼັບຄຳຖາມ (Random) - [ຕ້ອງເຮັດໝວດ 2 ໃຫ້ສร็จກ່ອນ]
                    </button>

                    <button id="btn-mode-4" onclick="validateAndStartApp('review_wrong')" style="padding: 10px 14px; font-size: 0.95rem; font-weight: bold; background: #64748b; color: #cbd5e1; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        🔒 4. ໂໝດແກ້ໄຂຂໍ້ຜິດ - [ຕ້ອງອ່ານໝວດ 1 ໃຫ້ຈົບກ່ອນ]
                    </button>

                    <button id="btn-category-5" onclick="openCategory5()" style="padding: 10px 14px; font-size: 0.95rem; font-weight: bold; background: #64748b; color: #cbd5e1; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        🔒 5. ໝວດທີ 5 (ສອບເສັງຈຳລອງພິເສດ) - [ຕ້ອງເຮັດໝວດ 2 ໃຫ້ສร็จກ່ອນ]
                    </button>
                </div>

                <div style="font-size: 0.75rem; color: #ffffff; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); font-weight: bold;">
                    ພັດທະນາໂດຍ: ທ່ານ ບຸນທັນ ຈັນທະລົບ (ເກັ່ງ) 020-77116687
                </div>
            </div>
        </div>

        <!-- 📝 หน้าจอทำข้อสอบ -->
        <div id="main-quiz-wrapper" style="display: none; flex-direction: column; width: 100%; height: 100%; justify-content: space-between;">
            <div>
<div style="font-size: 1.0rem; font-weight: bold; color: #ffffff; margin-bottom: 8px; background: rgba(0, 0, 0, 0.3); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
    <span style="display: flex; align-items: center; gap: 8px;">
        <img src="icon-192.png" alt="Logo" style="width: 26px; height: 26px; object-fit: contain; border-radius: 50%; background: #ffffff;">
        ໂຮງຮຽນສອນຂັບລົດບ້ານສາມັກຄີ
    </span>
    <img onclick="teacherUnlock()" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'></rect><path d='7 11V7a5 5 0 0 1 10 0v4'></path></svg>" title="ສໍາລັບຄູສອນ" style="cursor: pointer; opacity: 0.9; width: 22px; height: 22px;">
</div>

                <div style="margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h1 id="mode-header-title" style="font-size: 0.95rem; color: #ffffff !important; margin: 0; padding: 0; line-height: 1.0; font-weight: bold; display: none;"></h1>
                        <div id="round-counter-banner" style="font-size: 0.7rem; font-weight: bold; color: #ffffff; background: rgba(0, 0, 0, 0.25); padding: 3px 8px; border-radius: 4px; display: none; white-space: nowrap;">
                            🏆 ສອບຜ່ານ: <span id="passed-rounds-count">0</span> ຮອບ | 🔄 ອ່ານຈົບ: <span id="completed-rounds-count">0</span> ຮອບ
                        </div>
                    </div>
                    <div id="live-score-board" style="display: flex; gap: 8px; font-size: 0.8rem; font-weight: bold; color: #ffffff;">
                        <span id="score-correct-wrap">✅ ຖືກ: <span id="live-correct">0</span></span>
                        <span id="score-wrong-wrap">❌ ຜິດ: <span id="live-wrong">0</span></span>
                    </div>
                </div>

                <div id="sub-header-bar" class="category-select-box" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 4px 6px; background: rgba(0,0,0,0.15); border-radius: 6px;">
                    <div id="question-count" style="font-weight: bold; font-size: 0.8rem; color: #ffffff !important;">
                        ຄຳຖາມທີ 1 ທັງໝົດ 367 
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <select id="licenseCategory" onchange="changeCategory()" style="padding: 3px 6px; font-size: 0.8rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background-color: #475569 !important; color: #ffffff !important; font-weight: bold; outline: none; cursor: pointer;">
                            <option value="ABC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ ABC</option>
                            <option value="A.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ A</option>
                            <option value="AB.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ AB</option>
                            <option value="B.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ B</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ C</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ D</option>
                            <option value="CDBC.txt" style="background-color: #475569; color: #ffffff;">ປະເພດ BC</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="quiz-screen" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; margin-bottom: 6px;">
                <div class="question-card" style="flex-grow: 1; overflow-y: auto;">
                    <div class="question-title" id="question-text" style="color: #ffffff !important;">ກຳລັງໂຫຼດຂໍ້ສອບ...</div>
                    <div class="question-image" id="image-container" style="text-align: center; margin: 4px 0;"></div>
                    <div class="options-group" id="options-container"></div>
                </div>
            </div>

            <div id="result-screen" style="display: none; text-align: center; padding-top: 8px; flex-grow: 1; overflow-y: auto; color: #ffffff !important;">
                <div>
                    <h2 id="result-title-text" style="font-size: 1.15rem; font-weight: bold; color: #ffffff !important;">ຜົນການສອບເສັງຂອງທ່ານ</h2>
                    <div id="result-round-display" style="font-size: 0.95rem; font-weight: bold; margin: 5px 0; color: #ffffff !important;"></div>
                    <div class="score-display" id="final-score" style="margin: 8px 0; font-size: 1.25rem; font-weight: bold; color: #ffffff !important;">0 / 0</div>
                    <p id="score-message" style="margin-bottom: 12px; font-size: 0.9rem; line-height: 1.3; color: #ffffff !important;"></p>
                    <div id="result-action-buttons" style="display: flex; flex-direction: column; gap: 8px; max-width: 260px; margin: 0 auto;"></div>
                </div>
            </div>

            <div style="flex-shrink: 0; padding-bottom: 8px;">
                <button class="btn-next" id="btn-next" onclick="nextQuestion()" style="width: 100%; padding: 18px 14px; font-size: 1.2rem; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.4);">ກົດຂໍ້ຕໍ່ໄປ</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
